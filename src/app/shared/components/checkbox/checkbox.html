<button
  type="button"
  class="checkbox"
  [class.checkbox--checked]="checked()"
  (click)="onToggle()"
  role="checkbox"
  [attr.aria-checked]="checked()"
>
  @if (checked()) {
    <img src="icons/btn-check.svg" alt="" />
  }
</button>
