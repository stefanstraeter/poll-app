<div class="dropdown">
  <div class="dropdown__control">
    <button type="button" class="dropdown__header" (click)="toggleOpen()">
      {{ label() }}
      <svg
        class="dropdown__chevron"
        [class.dropdown__chevron--open]="isOpen()"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <path [attr.d]="isOpen() ? chevronUpPath : chevronDownPath" fill="currentColor" />
      </svg>
    </button>

    @if (isOpen()) {
    <button
      type="button"
      class="dropdown__backdrop"
      (click)="closeDropdown()"
    ></button>

    <ul class="dropdown__list">
      @for (option of options(); track option.value) {
      <li>
        <button
          type="button"
          class="dropdown__option"
          [class.dropdown__option--selected]="option.value === selected()"
          (click)="selectOption(option.value)"
        >
          {{ option.label }}
        </button>
      </li>
      }
    </ul>
    }
  </div>

  <span class="dropdown__selected">{{ selectedLabel() }}</span>
</div>
