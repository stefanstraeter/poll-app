<form class="survey-form" [formGroup]="surveyForm" (ngSubmit)="handleSubmit()">
  <div class="survey-form__card">
    <div class="survey-form__field survey-form__field--name">
      <div class="survey-form__field-header">
        <span class="survey-form__label">Survey name</span>
        <app-button variant="icon" class="delete-btn">
          <app-delete-icon />
        </app-button>
      </div>
      <input
        type="text"
        class="input-field"
        placeholder=""
        formControlName="title"
      />
      <span
        class="survey-form__error"
        [class.survey-form__error--visible]="surveyForm.controls.title.invalid && surveyForm.controls.title.touched"
      >
        Please enter a survey name
      </span>
    </div>

    <div class="survey-form__field survey-form__field--category">
      <app-dropdown
        label="Choose category"
        [options]="categoryOptions"
        [selected]="surveyForm.controls.category.value"
        (selectedChange)="surveyForm.controls.category.setValue($event)"
      />
      <span
        class="survey-form__error"
        [class.survey-form__error--visible]="surveyForm.controls.category.invalid && surveyForm.controls.category.touched"
      >
        Please select a category
      </span>
    </div>

    <div class="survey-form__field survey-form__field--enddate">
      <div class="survey-form__field-header">
        <span class="survey-form__label">Set end date (optional)</span>
        <app-button variant="icon" class="delete-btn">
          <app-delete-icon />
        </app-button>
      </div>
      <input
        type="text"
        class="input-field"
        placeholder="DD.MM.YYYY"
        formControlName="endsIn"
      />
    </div>

    <div class="survey-form__field survey-form__field--describing">
      <div class="survey-form__field-header">
        <span class="survey-form__label">Describing text (optional)</span>
        <app-button variant="icon" class="delete-btn">
          <app-delete-icon />
        </app-button>
      </div>
      <textarea
        class="textarea-field"
        placeholder=""
        formControlName="describingText"
      ></textarea>
    </div>

    <div class="survey-form__questions">
      @for (questionGroup of surveyForm.controls.questions.controls; track
      questionGroup; let questionIndex = $index) {
      <app-create-question
        [questionGroup]="questionGroup"
        [questionIndex]="questionIndex"
        (remove)="removeQuestion(questionIndex)"
      />
      }

      <app-button
        variant="neutral"
        class="survey-form__add-question"
        (click)="addQuestion()"
      >
        Add next question
        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M7.2 8.8V11.2C7.2 11.4267 7.27667 11.6167 7.43 11.77C7.58333 11.9233 7.77333 12 8 12C8.22667 12 8.41667 11.9233 8.57 11.77C8.72333 11.6167 8.8 11.4267 8.8 11.2V8.8H11.2C11.4267 8.8 11.6167 8.72333 11.77 8.57C11.9233 8.41667 12 8.22667 12 8C12 7.77333 11.9233 7.58333 11.77 7.43C11.6167 7.27667 11.4267 7.2 11.2 7.2H8.8V4.8C8.8 4.57333 8.72333 4.38333 8.57 4.23C8.41667 4.07667 8.22667 4 8 4C7.77333 4 7.58333 4.07667 7.43 4.23C7.27667 4.38333 7.2 4.57333 7.2 4.8V7.2H4.8C4.57333 7.2 4.38333 7.27667 4.23 7.43C4.07667 7.58333 4 7.77333 4 8C4 8.22667 4.07667 8.41667 4.23 8.57C4.38333 8.72333 4.57333 8.8 4.8 8.8H7.2ZM8 16C6.89333 16 5.85333 15.79 4.88 15.37C3.90667 14.95 3.06 14.38 2.34 13.66C1.62 12.94 1.05 12.0933 0.63 11.12C0.21 10.1467 0 9.10667 0 8C0 6.89333 0.21 5.85333 0.63 4.88C1.05 3.90667 1.62 3.06 2.34 2.34C3.06 1.62 3.90667 1.05 4.88 0.63C5.85333 0.21 6.89333 0 8 0C9.10667 0 10.1467 0.21 11.12 0.63C12.0933 1.05 12.94 1.62 13.66 2.34C14.38 3.06 14.95 3.90667 15.37 4.88C15.79 5.85333 16 6.89333 16 8C16 9.10667 15.79 10.1467 15.37 11.12C14.95 12.0933 14.38 12.94 13.66 13.66C12.94 14.38 12.0933 14.95 11.12 15.37C10.1467 15.79 9.10667 16 8 16ZM8 14.4C9.78667 14.4 11.3 13.78 12.54 12.54C13.78 11.3 14.4 9.78667 14.4 8C14.4 6.21333 13.78 4.7 12.54 3.46C11.3 2.22 9.78667 1.6 8 1.6C6.21333 1.6 4.7 2.22 3.46 3.46C2.22 4.7 1.6 6.21333 1.6 8C1.6 9.78667 2.22 11.3 3.46 12.54C4.7 13.78 6.21333 14.4 8 14.4Z"
            fill="#FEFDFF"
          />
        </svg>
      </app-button>
    </div>
  </div>

  <app-button variant="primary" class="survey-form__publish" type="submit">
    Publish
    <svg
      width="18"
      height="16"
      viewBox="0 0 18 16"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M6.1556 12.5078L16.0211 0.427617C16.2539 0.142539 16.5255 0 16.8359 0C17.1463 0 17.418 0.142539 17.6508 0.427617C17.8836 0.712695 18 1.05122 18 1.44321C18 1.83519 17.8836 2.17372 17.6508 2.4588L6.97045 15.5724C6.73763 15.8575 6.46602 16 6.1556 16C5.84518 16 5.57356 15.8575 5.34075 15.5724L0.335252 9.44321C0.102438 9.15813 -0.00911854 8.8196 0.000582034 8.42762C0.0102826 8.03563 0.13154 7.6971 0.364354 7.41203C0.597167 7.12695 0.873634 6.98441 1.19375 6.98441C1.51387 6.98441 1.79034 7.12695 2.02315 7.41203L6.1556 12.5078Z"
        fill="#35273A"
      />
    </svg>
  </app-button>
</form>
